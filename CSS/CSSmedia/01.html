<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @media(max-width:400px) {
           .mobile{
            height: 200px;
            width: 100px;
            background-color: blueviolet;
        }
        }
        @media(min-width:600px) and (max-width:1200px){
            .tab{
            height: 200px;
            width: 100px;
            background-color: aqua;
        }
        }
       
        .Lap{
            height: 200px;
            width: 100px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="mobile">
        Mobile
    </div>
    <div class="tab">
        TAB
    </div>
    <div class="Lap">
        LAPTOP
    </div>
</body>
</html>
